<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AgroBridge — Booking</title>
<style>
 :root{--saffron:#FF9933;--green:#138808;--ink:#111827;--muted:#6b7280;--bg:#f9fafb}
 *{box-sizing:border-box} body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;min-height:100vh}
 .top{height:5px;background:var(--saffron)} .bottom{height:5px;background:var(--green);margin-top:auto}
 header{padding:14px;text-align:center} h1{margin:0;font-size:18px} p{color:var(--muted);font-size:13px;margin:6px 0 0}
 .wrap{max-width:560px;width:100%;margin:0 auto;padding:0 14px 16px;flex:1;display:flex;flex-direction:column}
 .card{background:#fff;border-radius:16px;padding:12px;box-shadow:0 6px 20px rgba(0,0,0,.07);margin:8px 0}
 .row{display:flex;gap:8px}
 input,select{height:42px;border:1px solid #d1d5db;border-radius:10px;padding:0 12px;flex:1}
 .chat{flex:1;min-height:340px;max-height:55vh;overflow:auto;padding:14px;background:#f3f4f6;border-radius:14px}
 .msg{max-width:86%;padding:10px 12px;border-radius:14px;margin:8px 0;font-size:15px;line-height:1.45}
 .bot{background:#e8f5e9;border-left:3px solid var(--green)} .me{background:#fff3e0;border-right:3px solid var(--saffron);margin-left:auto;text-align:right}
 .sys{font-size:12px;color:var(--muted);text-align:center}
 .btn{height:42px;border:0;border-radius:10px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center}
 .mic{flex:1;background:var(--green);color:#fff} .mic.rec{background:#dc2626}
 .send{width:90px;background:#111827;color:#fff}
 .status{font-size:13px;color:var(--muted);text-align:center;min-height:18px}
</style>
</head>
<body>
<div class="top"></div>
<header><h1>AgroBridge — Booking</h1><p>Say once, I ask only what's missing, then confirm</p></header>
<div class="wrap">
 <div class="card row"><select id="lang"><option value="hi">हिन्दी</option><option value="en">English</option></select><input id="phone" maxlength="10" value="9100000001"></div>
 <div class="chat" id="chat"></div>
 <div class="status" id="status">Ready</div>
 <div class="card">
  <div class="row"><input id="text" placeholder="gurugram me gehu 20 quintal aaj"><button id="send" class="btn send">Send</button></div>
  <button id="mic" class="btn mic" style="margin-top:10px;width:100%">🎤 Speak</button>
 </div>
</div>
<div style="text-align:center;font-size:10px;color:#9ca3af;opacity:0.6;margin:8px 0;letter-spacing:0.4px">Powered by Sarvam • Bulbul</div>
<div class="bottom"></div>
<script>
(function(){
 const $=id=>document.getElementById(id);
 const chat=$('chat'), status=$('status'), text=$('text'), phoneEl=$('phone'), langEl=$('lang'), micBtn=$('mic');
 let messages=[]; let rec=null; let recording=false; let player=null;
 const log=(c,t)=>{ const d=document.createElement('div'); d.className='msg '+c; d.textContent=t; chat.appendChild(d); chat.scrollTop=1e9; };
 function setStatus(t){ status.textContent=t; }
 // hard stop any audio
 function hardStop(){
   try{ if(player){player.pause();player.src='';player.currentTime=0;player=null;} }catch(e){}
   try{ window.speechSynthesis.cancel(); }catch(e){}
   try{ document.querySelectorAll('audio').forEach(a=>{a.pause();a.src='';}); }catch(e){}
 }
 function speak(tt){
   hardStop();
   const lang=langEl.value==='hi'?'hi':'en';
   const a=new Audio('/tts?lang='+encodeURIComponent(lang)+'&text='+encodeURIComponent(String(tt).slice(0,400)));
   player=a;
   setStatus("🔊 बोल रहा हूँ — tap mic to interrupt");
   a.onended=()=>setStatus("Ready");
   a.onerror=()=>{
     try{
       const u=new SpeechSynthesisUtterance(tt);
       u.lang=lang==='hi'?'hi-IN':'en-IN'; u.rate=0.96;
       u.onend=()=>setStatus("Ready");
       window.speechSynthesis.speak(u);
     }catch(e){ setStatus("Ready"); }
   };
   a.play().catch(()=>{
     try{
       const u=new SpeechSynthesisUtterance(tt);
       u.lang=lang==='hi'?'hi-IN':'en-IN';
       window.speechSynthesis.speak(u);
     }catch(e){}
   });
 }
 async function send(content){
   if(!content.trim()) return;
   const p=phoneEl.value.replace(/\D/g,''); if(p.length!==10){ alert('10-digit'); return; }
   hardStop();
   log('me', content);
   messages.push({role:'user', content});
   setStatus("…");
   try{
     const r=await fetch('/agent/chat',{method:'POST',headers:{'Content-Type':'application/json','x-agb-key':'agb-dev-key'},body:JSON.stringify({messages, phone:p, lang:langEl.value})});
     const j=await r.json();
     const reply=j.reply||'क्षमा';
     messages.push({role:'assistant', content:reply});
     log('bot', reply);
     speak(reply);
     if(j.done) log('sys','✓ Booked');
   }catch(e){ log('bot','नेटवर्क'); setStatus("Ready"); }
 }
 function toggleMic(){
   hardStop(); // <— shuts up instantly
   if(recording){ try{rec.stop()}catch(e){} return; }
   const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
   if(!SR){ const t=prompt("Type:"); if(t) send(t); return; }
   rec=new SR();
   rec.lang=langEl.value==='hi'?'hi-IN':'en-IN';
   rec.interimResults=false; rec.continuous=false;
   recording=true; micBtn.classList.add('rec'); micBtn.textContent='⏹️ Stop'; setStatus("🎤 सुन रहा हूँ");
   rec.onresult=e=>{ const t=(e.results[0]&&e.results[0][0]&&e.results[0][0].transcript)||""; if(t) send(t); };
   rec.onend=()=>{ recording=false; micBtn.classList.remove('rec'); micBtn.textContent='🎤 Speak'; setStatus("Ready"); };
   rec.onerror=()=>{ recording=false; micBtn.classList.remove('rec'); };
   try{ rec.start(); setTimeout(()=>{ try{rec.stop()}catch(e){} }, 6000);}catch(e){ recording=false; }
 }
 micBtn.onclick=toggleMic;
 $('send').onclick=()=>{ const v=text.value.trim(); if(v){ text.value=''; send(v);} };
 text.onkeydown=e=>{ if(e.key==='Enter'){ const v=text.value.trim(); if(v){ text.value=''; send(v);} } };
 setStatus("Ready — type or tap Speak");
})();
</script>
</body>
</html>
