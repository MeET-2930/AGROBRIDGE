services:
  - type: web
    name: agrobridge-ivr
    runtime: node
    rootDir: ivr
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      # Values in the Render dashboard (sync: false = never stored in git).
      - key: BASE_URL
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_B64
        sync: false
      - key: PROVIDER
        value: sim
      - key: APP_SHARED_KEY
        sync: false
      # Required: the server crashes on boot without the Gemini key.
      - key: GEMINI_API_KEY
        sync: false
      # Optional model override (default: gemini-3.1-flash-lite).
      - key: GEMINI_MODEL
        sync: false
      # Optional agent provider. Keep "gemini" unless Antigravity is
      # intentionally enabled; see ivr/README.md for its env vars.
      - key: CHATBOT_PROVIDER
        value: gemini
      - key: CHATBOT_ANTIGRAVITY_FALLBACK
        sync: false
      - key: ANTIGRAVITY_AGENT
        sync: false
      - key: ANTIGRAVITY_MAX_TOTAL_TOKENS
        sync: false
      - key: ANTIGRAVITY_TIMEOUT_MS
        sync: false
      - key: ANTIGRAVITY_MAX_STEPS
        sync: false
      - key: ANTIGRAVITY_MODEL
        sync: false
      # Opt-in guard on /chat + /translate (the code default is OFF, so
      # unset = off). Set to "true" once the app build that sends
      # x-agb-key is live (web rebuilt + deployed, testers updated via
      # EAS); until then "false" keeps current clients working.
      - key: CHATBOT_REQUIRE_KEY
        value: "false"
      # Server-side kill switch for real chat bookings. Disabled by default
      # (value: "false"). Set to "true" only in the intended demo environment
      # once Firebase identity verification is in place and the deployment
      # is trusted. This flag must be explicitly set in Render; it is NEVER
      # on by default (see ivr/chatbot.js CHATBOT_ALLOW_BOOKING).
      - key: CHATBOT_ALLOW_BOOKING
        value: "false"
