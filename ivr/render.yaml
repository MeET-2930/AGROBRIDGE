services:
  - type: web
    name: agrobridge-ivr
    runtime: node
    rootDir: ivr
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      # Values in the Render dashboard (sync: false = never stored in git).
      - key: BASE_URL
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_B64
        sync: false
      - key: PROVIDER
        value: sim
      - key: APP_SHARED_KEY
        sync: false
      # Required: the server crashes on boot without the Gemini key.
      - key: GEMINI_API_KEY
        sync: false
      # Optional model override (default: gemini-3.1-flash-lite).
      - key: GEMINI_MODEL
        sync: false
      # Opt-in guard on /chat + /translate (the code default is OFF, so
      # unset = off). Set to "true" once the app build that sends
      # x-agb-key is live (web rebuilt + deployed, testers updated via
      # EAS); until then "false" keeps current clients working.
      - key: CHATBOT_REQUIRE_KEY
        value: "false"
