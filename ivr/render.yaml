services:
  - type: web
    name: agrobridge-ivr
    runtime: node
    rootDir: ivr
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: BASE_URL
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_B64
        sync: false
      - key: PROVIDER
        value: plivo
      - key: PLIVO_AUTH_ID
        sync: false
      - key: PLIVO_AUTH_TOKEN
        sync: false
      - key: PLIVO_FROM
        sync: false
      - key: APP_SHARED_KEY
        sync: false
