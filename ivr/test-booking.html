<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Test Firebase Booking — No Credits</title>
<style>
 body{font-family:system-ui,sans-serif;background:#09090b;color:#e5e7eb;max-width:520px;margin:0 auto;padding:18px}
 h1{font-size:18px;text-align:center} .card{background:#18181b;border:1px solid #27272a;border-radius:14px;padding:14px;margin:12px 0}
 label{font-size:12px;color:#9ca3af;display:block;margin:8px 0 4px}
 input,select{width:100%;padding:10px;border-radius:8px;border:1px solid #2a2a33;background:#0f1115;color:#fff;outline:none}
 button{width:100%;padding:12px;border-radius:10px;background:#7c3aed;color:#fff;border:none;font-weight:700;margin-top:10px;cursor:pointer}
 pre{background:#0a0a0f;border:1px solid #1f1f23;border-radius:8px;padding:10px;font-size:12px;white-space:pre-wrap;word-break:break-word;max-height:220px;overflow:auto}
 .ok{color:#22c55e} .err{color:#f87171}
</style>
</head>
<body>
<h1>Test Firebase Booking — 0 ElevenLabs credits</h1>
<div class="card">
  <label>Base URL (Render)</label>
  <input id="base" value="https://agrobridge-ivr.onrender.com"/>
  <label>Phone (10 digits)</label>
  <input id="phone" placeholder="98XXXXXXXX" maxlength="10"/>
  <label>Name (for new farmer)</label>
  <input id="name" placeholder="Ramesh"/>
  <label>Mandi</label>
  <select id="centre"><option value="centre_gurugram_01">Gurugram</option><option value="centre_sohna_02">Sohna</option><option value="centre_rewari_03">Rewari</option><option value="centre_pataudi_04">Pataudi</option><option value="centre_farrukhnagar_05">Farrukhnagar</option></select>
  <label>Crop</label>
  <select id="crop"><option value="wheat">wheat (गेहूं)</option><option value="paddy">paddy (धान)</option><option value="mustard">mustard (सरसों)</option><option value="cotton">cotton</option><option value="maize">maize</option><option value="gram">gram</option></select>
  <label>Quantity (quintal)</label>
  <input id="qty" type="number" value="20"/>
  <label>Date (YYYY-MM-DD)</label>
  <input id="date" type="date"/>
  <label>Slot HH:00 (raat 10 baje = 22:00)</label>
  <input id="slot" value="22:00"/>
  <button onclick="checkFarmer()">1️⃣ Check farmer (GET /api/farmer)</button>
  <button onclick="registerFarmer()">2️⃣ Register farmer (POST /api/farmer)</button>
  <button onclick="book()">3️⃣ Book slot (POST /api/book)</button>
  <button onclick="verify()">4️⃣ Verify bookings (GET /api/bookings)</button>
  <pre id="log">Logs here...</pre>
  <div style="font-size:11px;color:#71717a">This page calls your Render Firebase endpoints directly — no ElevenLabs, no credits. If this books, your orb will book too.</div>
</div>
<script>
const $=id=>document.getElementById(id);
const logEl=$('log');
function log(m){ logEl.textContent=m; }
function base(){ return $('base').value.replace(/\/$/,''); }
const today=new Date(); today.setDate(today.getDate()+1); $('date').valueAsDate=today;

async function checkFarmer(){
  const phone=$('phone').value.replace(/\D/g,'');
  const r=await fetch(`${base()}/api/farmer?phone=${phone}`);
  const j=await r.json(); log(JSON.stringify(j, null, 2));
}
async function registerFarmer(){
  const phone=$('phone').value.replace(/\D/g,'');
  const name=$('name').value.trim();
  const r=await fetch(`${base()}/api/farmer`,{method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({phone, name})});
  const j=await r.json(); log(JSON.stringify(j, null, 2));
}
async function book(){
  const body={
    centreId:$('centre').value,
    crop:$('crop').value,
    quantity:Number($('qty').value),
    date:$('date').value,
    slot:$('slot').value,
    phone:$('phone').value.replace(/\D/g,''),
    farmerName:$('name').value.trim()
  };
  const r=await fetch(`${base()}/api/book`,{method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
  const j=await r.json(); log(JSON.stringify(j, null, 2));
}
async function verify(){
  const phone=$('phone').value.replace(/\D/g,'');
  const r=await fetch(`${base()}/api/bookings?phone=${phone}`);
  const j=await r.json(); log(JSON.stringify(j, null, 2));
}
</script>
</body>
</html>
